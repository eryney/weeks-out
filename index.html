<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b68">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Weeks Out">
    <title>Weeks Out Calculator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
      :root {
        color-scheme: light;
        --ink: #1d252c;
        --muted: #5d6873;
        --paper: #fbfaf7;
        --line: #d9d4ca;
        --field: #ffffff;
        --accent: #176b68;
        --accent-strong: #0f4d4a;
        --result: #eef6f3;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(145deg, rgba(23, 107, 104, 0.12), transparent 34%),
          var(--paper);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 7vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      form {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 24px 60px rgba(29, 37, 44, 0.08);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
        padding: 0 12px;
      }

      input:focus,
      select:focus {
        outline: 3px solid rgba(23, 107, 104, 0.18);
        border-color: var(--accent);
      }

      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button:hover {
        background: var(--accent-strong);
      }

      output {
        display: block;
        margin-top: 18px;
        min-height: 96px;
        border: 1px solid rgba(23, 107, 104, 0.22);
        border-radius: 8px;
        background: var(--result);
        padding: 18px;
      }

      .result-label {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
        margin-bottom: 6px;
      }

      .result-date {
        color: var(--accent-strong);
        font-size: clamp(1.8rem, 8vw, 2.7rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
      }

      .result-detail {
        color: var(--muted);
        margin-top: 8px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Weeks Out</h1>
      <p>Pick a starting date, choose 2 through 10 weeks, and get the exact date.</p>

      <form id="date-form">
        <div class="field">
          <label for="start-date">Starting date</label>
          <input id="start-date" name="start-date" type="date" required>
        </div>

        <div class="field">
          <label for="weeks">Weeks out</label>
          <select id="weeks" name="weeks">
            <option value="2">2 weeks</option>
            <option value="3">3 weeks</option>
            <option value="4">4 weeks</option>
            <option value="5">5 weeks</option>
            <option value="6">6 weeks</option>
            <option value="7">7 weeks</option>
            <option value="8">8 weeks</option>
            <option value="9">9 weeks</option>
            <option value="10">10 weeks</option>
          </select>
        </div>

        <button type="submit">Calculate date</button>

        <output id="result" aria-live="polite">
          <div class="result-label">Result</div>
          <div class="result-date">Choose a date</div>
          <div class="result-detail">Today is prefilled when the page opens.</div>
        </output>
      </form>
    </main>

    <script>
      const dateInput = document.querySelector("#start-date");
      const weeksInput = document.querySelector("#weeks");
      const form = document.querySelector("#date-form");
      const result = document.querySelector("#result");

      const formatter = new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      function toInputDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function renderDate() {
        if (!dateInput.value) return;

        const weeks = Number(weeksInput.value);
        const start = parseLocalDate(dateInput.value);
        const target = new Date(start);
        target.setDate(start.getDate() + weeks * 7);

        result.innerHTML = `
          <div class="result-label">${weeks} weeks from ${formatter.format(start)}</div>
          <div class="result-date">${formatter.format(target)}</div>
          <div class="result-detail">${weeks * 7} days later</div>
        `;
      }

      dateInput.value = toInputDate(new Date());
      renderDate();

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        renderDate();
      });

      dateInput.addEventListener("change", renderDate);
      weeksInput.addEventListener("change", renderDate);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
