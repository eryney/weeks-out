<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#154734">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Weeks Out">
    <title>UVM Radiation Oncology Weeks Out Calculator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
      :root {
        color-scheme: light;
        --green: #154734;
        --green-dark: #0a2f22;
        --green-soft: #e7f0eb;
        --gold: #ffd100;
        --ink: #14211d;
        --muted: #5d6964;
        --paper: #f7f6ef;
        --panel: #ffffff;
        --line: #d8d7cb;
        --shadow: 0 24px 70px rgba(20, 33, 29, 0.12);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: var(--panel);
        color: var(--ink);
        border-bottom: 6px solid var(--gold);
        box-shadow: 0 10px 34px rgba(20, 33, 29, 0.08);
      }

      .topbar-inner {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 16px 20px 14px;
        display: grid;
        gap: 10px;
      }

      .brand-logo {
        display: block;
        width: min(100%, 560px);
        height: auto;
      }

      .department-banner {
        width: fit-content;
        margin: 0;
        background: var(--green);
        color: #ffffff;
        border-radius: 4px;
        padding: 8px 11px;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 34px 20px 42px;
        flex: 1;
      }

      .tool {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .tool-header {
        padding: 28px 28px 24px;
        background:
          linear-gradient(90deg, rgba(21, 71, 52, 0.08), rgba(255, 209, 0, 0.13)),
          #ffffff;
        border-bottom: 1px solid var(--line);
      }

      .tool-label {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 7vw, 4.35rem);
        line-height: 0.94;
        letter-spacing: 0;
      }

      .intro {
        margin: 14px 0 0;
        max-width: 620px;
        color: var(--muted);
        font-size: clamp(1rem, 2.6vw, 1.12rem);
        line-height: 1.55;
      }

      form {
        padding: 28px;
      }

      .control-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 180px;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: var(--green-dark);
        font-size: 0.82rem;
        font-weight: 850;
      }

      input,
      select {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-size: 1.05rem;
        padding: 0 14px;
      }

      input:focus,
      select:focus {
        outline: 3px solid rgba(255, 209, 0, 0.42);
        border-color: var(--green);
      }

      button {
        width: auto;
        min-height: 50px;
        border: 0;
        border-radius: 6px;
        background: var(--green);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 0 20px;
        margin-top: 20px;
      }

      button:hover {
        background: var(--green-dark);
      }

      output {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-top: 24px;
        min-height: 132px;
        border: 1px solid rgba(21, 71, 52, 0.22);
        border-left: 6px solid var(--gold);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(21, 71, 52, 0.08), transparent 42%),
          var(--green-soft);
        padding: 22px;
      }

      .result-label {
        color: var(--green);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .result-date {
        color: var(--green-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 7.5vw, 3.2rem);
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .result-detail {
        color: var(--muted);
        margin-top: 10px;
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .result-badge {
        align-self: stretch;
        min-width: 96px;
        border: 1px solid rgba(21, 71, 52, 0.18);
        background: rgba(255, 255, 255, 0.58);
        border-radius: 6px;
        display: grid;
        place-items: center;
        padding: 12px;
        text-align: center;
      }

      .result-weeks {
        color: var(--green);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.35rem;
        font-weight: 900;
        line-height: 1;
      }

      .result-unit {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
        margin-top: 4px;
        text-transform: uppercase;
      }

      @media (max-width: 640px) {
        .topbar-inner {
          padding: 14px;
        }

        .brand-logo {
          width: 100%;
          max-width: 420px;
        }

        .department-banner {
          width: 100%;
          text-align: center;
        }

        main {
          padding: 18px 14px 28px;
        }

        .tool-header,
        form {
          padding: 20px;
        }

        .control-grid,
        output {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }

        .result-badge {
          min-width: 0;
          grid-template-columns: auto auto;
          justify-content: center;
          gap: 8px;
        }

        .result-unit {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <img class="brand-logo" src="assets/logos.png" alt="University of Vermont Health and University of Vermont Cancer Center">
          <p class="department-banner">Department of Radiation Oncology</p>
        </div>
      </header>

      <main>
        <section class="tool" aria-labelledby="tool-title">
          <div class="tool-header">
            <p class="tool-label">Treatment Date Utility</p>
            <h1 id="tool-title">Weeks Out</h1>
            <p class="intro">Pick a starting date, choose a 2 to 10 week interval, and get the exact target date.</p>
          </div>

          <form id="date-form">
            <div class="control-grid">
              <div class="field">
                <label for="start-date">Starting Date</label>
                <input id="start-date" name="start-date" type="date" required>
              </div>

              <div class="field">
                <label for="weeks">Interval</label>
                <select id="weeks" name="weeks">
                  <option value="2">2 weeks</option>
                  <option value="3">3 weeks</option>
                  <option value="4">4 weeks</option>
                  <option value="5">5 weeks</option>
                  <option value="6">6 weeks</option>
                  <option value="7">7 weeks</option>
                  <option value="8">8 weeks</option>
                  <option value="9">9 weeks</option>
                  <option value="10">10 weeks</option>
                </select>
              </div>
            </div>

            <button type="submit">Calculate Date</button>

            <output id="result" aria-live="polite">
              <div>
                <div class="result-label">Calculated Date</div>
                <div class="result-date">Choose a date</div>
                <div class="result-detail">Today is prefilled when the page opens.</div>
              </div>
              <div class="result-badge" aria-hidden="true">
                <div class="result-weeks">2</div>
                <div class="result-unit">weeks</div>
              </div>
            </output>
          </form>
        </section>
      </main>
    </div>

    <script>
      const dateInput = document.querySelector("#start-date");
      const weeksInput = document.querySelector("#weeks");
      const form = document.querySelector("#date-form");
      const result = document.querySelector("#result");

      const formatter = new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      function toInputDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function renderDate() {
        if (!dateInput.value) return;

        const weeks = Number(weeksInput.value);
        const start = parseLocalDate(dateInput.value);
        const target = new Date(start);
        target.setDate(start.getDate() + weeks * 7);

        result.innerHTML = `
          <div>
            <div class="result-label">Calculated Date</div>
            <div class="result-date">${formatter.format(target)}</div>
            <div class="result-detail">${weeks} weeks from ${formatter.format(start)} (${weeks * 7} days later)</div>
          </div>
          <div class="result-badge" aria-hidden="true">
            <div class="result-weeks">${weeks}</div>
            <div class="result-unit">weeks</div>
          </div>
        `;
      }

      dateInput.value = toInputDate(new Date());
      renderDate();

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        renderDate();
      });

      dateInput.addEventListener("change", renderDate);
      weeksInput.addEventListener("change", renderDate);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then((registration) => {
            registration.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
